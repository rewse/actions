# git-cliff configuration
# https://git-cliff.org/docs/configuration

[changelog]
header = ""
body = """
{%- set group_order = [
  "🚀 New Features",
  "🐛 Bug Fixes",
  "⚡ Performance",
  "✨ Refactoring",
  "🧪 Tests",
  "📚 Documentation",
  "🎨 Styling",
  "📦 Build",
  "⚙️ CI/CD",
  "🔧 Maintenance"
] -%}
{% for group_name in group_order %}
{%- set group_commits = commits | filter(attribute="group", value=group_name) -%}
{% if group_commits | length > 0 %}
### {{ group_name }}
{% for commit in group_commits %}
- {{ commit.message | split(pat="\n") | first | trim }}\
{% endfor %}
{% endif %}
{%- endfor %}

**Full Changelog**: https://github.com/rewse/actions/compare/{{ previous.version }}...{{ version }}
"""
footer = ""
trim = true

[git]
conventional_commits = true
filter_unconventional = true
split_commits = false
commit_parsers = [
  { message = "^feat", group = "🚀 New Features" },
  { message = "^fix", group = "🐛 Bug Fixes" },
  { message = "^perf", group = "⚡ Performance" },
  { message = "^refactor", group = "✨ Refactoring" },
  { message = "^test", group = "🧪 Tests" },
  { message = "^docs", group = "📚 Documentation" },
  { message = "^style", group = "🎨 Styling" },
  { message = "^build", group = "📦 Build" },
  { message = "^ci", group = "⚙️ CI/CD" },
  { message = "^chore\\(release\\)", skip = true },
  { message = "^chore: bump version", skip = true },
  { message = "^chore", group = "🔧 Maintenance"}
]
filter_commits = false
tag_pattern = "v[0-9].*"
