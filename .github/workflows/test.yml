name: Test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - run: tests/test_resolve_version.sh

      - run: tests/test_semver_gate.sh

      - run: tests/test_parse_verdict.sh

      - run: tests/test_build_prompt.sh

      - run: tests/test_check_status.sh

      - run: tests/test_wait_checks.sh

      - run: tests/test_render_comment.sh

      - run: tests/test_post_comment.sh

      - run: tests/test_trufflehog_dockerfile.sh

      - run: tests/test_next_auto_tag.sh

  setup-safe-chain:
    name: Setup Safe Chain
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - id: setup
        # actionlint does not parse the $/ self-repository syntax yet, and the job
        # checks out the repository anyway.
        uses: ./setup-safe-chain  # zizmor: ignore[self-repository]

      - name: Check the installed version
        env:
          WANT: ${{ steps.setup.outputs.version }}
        run: |
          got=$("$HOME/.safe-chain/bin/safe-chain" -v)
          echo "$got"
          grep -F "Current safe-chain version: ${WANT}" <<<"$got"

  trufflehog:
    name: TruffleHog Action
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # The action scans the local main branch, which a checkout of another
      # branch or a pull request does not create.
      - name: Create the local main branch
        run: git show-ref --verify --quiet refs/heads/main || git branch main origin/main

      # actionlint does not parse the $/ self-repository syntax yet, and the job
      # checks out the repository anyway.
      - uses: ./trufflehog  # zizmor: ignore[self-repository]
        with:
          extra-args: --results=verified,unknown
