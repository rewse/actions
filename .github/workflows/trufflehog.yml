name: TruffleHog

on:
  schedule:
    - cron: "49 19 * * 0"  # Every Monday at 04:49 JST (19:49 UTC Sun)
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    name: Secret Sweep
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # actionlint does not parse the $/ self-repository syntax yet, and the job
      # checks out the repository anyway.
      - uses: ./trufflehog  # zizmor: ignore[self-repository]
        with:
          extra-args: --results=verified,unknown
